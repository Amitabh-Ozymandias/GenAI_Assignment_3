<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document Chat Assistant</title>
  <style>
    :root {
      --bg-main: #0f0f11;
      --bg-panel: #14141a;
      --bg-header: #1a1a1f;
      --border-color: #2a2a35;
      --primary-color: #6c63ff;
      --primary-hover: #5a52e0;
      --text-light: #e0e0e0;
      --text-muted: #888;
      --text-dark: #444;
      --success: #4ade80;
      --error: #f87171;
      --warning: #facc15;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: var(--bg-main); 
      color: var(--text-light); 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
    }

    .top-nav { 
      padding: 1rem 1.5rem; 
      background-color: var(--bg-header); 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      gap: 1rem; 
    }
    
    .top-nav .brand-title { font-size: 1.15rem; font-weight: 600; color: #ffffff; }
    .top-nav .tagline { font-size: 0.75rem; color: var(--text-muted); background: var(--border-color); padding: 0.2rem 0.6rem; border-radius: 50px; }

    .main-wrapper { display: flex; flex: 1; overflow: hidden; }

    /* Left Sidebar */
    .file-sidebar { 
      width: 320px; 
      min-width: 280px; 
      background-color: var(--bg-panel); 
      border-right: 1px solid var(--border-color); 
      display: flex; 
      flex-direction: column; 
      padding: 1.5rem 1rem; 
      gap: 1.2rem; 
    }
    
    .file-sidebar h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }

    .upload-area { 
      border: 2px dashed #3a3a50; 
      border-radius: 12px; 
      padding: 2rem 1rem; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      color: #666; 
      font-size: 0.85rem; 
    }
    
    .upload-area:hover, .upload-area.active-drag { border-color: var(--primary-color); color: #a09cf7; background: rgba(108, 99, 255, 0.05); }
    .upload-area svg { display: block; margin: 0 auto 0.75rem; opacity: 0.6; }
    #hidden-file-picker { display: none; }

    .btn-action { 
      width: 100%; 
      padding: 0.75rem; 
      background-color: var(--primary-color); 
      color: #ffffff; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      font-weight: 500; 
      transition: background-color 0.2s; 
    }
    
    .btn-action:hover:not(:disabled) { background-color: var(--primary-hover); }
    .btn-action:disabled { background-color: #3a3a55; color: #666; cursor: not-allowed; }

    .feedback-text { font-size: 0.8rem; color: var(--text-muted); min-height: 20px; }
    .feedback-text.is-success { color: var(--success); }
    .feedback-text.is-error { color: var(--error); }
    .feedback-text.is-loading { color: var(--warning); }

    .active-doc-indicator { 
      background-color: #1e1e2e; 
      border: 1px solid #3a3a50; 
      border-radius: 8px; 
      padding: 0.75rem; 
      font-size: 0.85rem; 
      color: #a09cf7; 
      display: none; 
      word-break: break-all; 
    }
    .active-doc-indicator.visible { display: block; }

    /* Conversation Area */
    .conversation-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    .chat-history { 
      flex: 1; 
      overflow-y: auto; 
      padding: 2rem; 
      display: flex; 
      flex-direction: column; 
      gap: 1.2rem; 
    }
    
    .chat-history::-webkit-scrollbar { width: 8px; }
    .chat-history::-webkit-scrollbar-track { background: transparent; }
    .chat-history::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .placeholder-view { margin: auto; text-align: center; color: var(--text-dark); }
    .placeholder-view svg { display: block; margin: 0 auto 1rem; }
    .placeholder-view p { font-size: 0.95rem; }

    .chat-bubble-container { max-width: 75%; width: 100%; display: flex; flex-direction: column; }
    .chat-bubble-container.from-user { align-self: flex-end; }
    .chat-bubble-container.from-ai { align-self: flex-start; }
    
    .bubble-content { 
      padding: 0.85rem 1.15rem; 
      border-radius: 12px; 
      font-size: 0.95rem; 
      line-height: 1.5; 
      white-space: pre-wrap; 
    }
    
    .chat-bubble-container.from-user .bubble-content { 
      background-color: var(--primary-color); 
      color: #ffffff; 
      border-bottom-right-radius: 2px; 
    }
    
    .chat-bubble-container.from-ai .bubble-content { 
      background-color: #1e1e2e; 
      border: 1px solid var(--border-color); 
      border-bottom-left-radius: 2px; 
      color: var(--text-light); 
    }
    
    .sender-name { font-size: 0.75rem; color: #555; margin-bottom: 0.3rem; padding: 0 0.25rem; }
    .chat-bubble-container.from-user .sender-name { text-align: right; }

    .processing .bubble-content { color: var(--text-muted); font-style: italic; }

    .composer-area { 
      padding: 1rem 1.5rem; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      gap: 0.8rem; 
      background-color: var(--bg-panel); 
    }
    
    #prompt-input { 
      flex: 1; 
      background-color: #1e1e2e; 
      border: 1px solid #3a3a50; 
      color: var(--text-light); 
      padding: 0.75rem 1rem; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      outline: none; 
      resize: none; 
      max-height: 150px; 
      font-family: inherit;
    }
    
    #prompt-input:focus { border-color: var(--primary-color); }
    #prompt-input::placeholder { color: var(--text-dark); }
    
    .btn-submit { 
      padding: 0.75rem 1.2rem; 
      background-color: var(--primary-color); 
      color: #ffffff; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      font-weight: 500; 
      align-self: flex-end; 
      transition: background-color 0.2s; 
    }
    
    .btn-submit:hover:not(:disabled) { background-color: var(--primary-hover); }
    .btn-submit:disabled { background-color: #3a3a55; color: #666; cursor: not-allowed; }
  </style>
</head>
<body>
  <header class="top-nav">
    <div class="brand-title">Smart Document QA</div>
    <span class="tagline">RAG Architecture</span>
  </header>

  <main class="main-wrapper">
    <!-- Left Panel -->
    <aside class="file-sidebar">
      <h3>Source Document</h3>

      <div class="upload-area" id="document-drop-area">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        <span>Drag & drop PDF/TXT or click to select</span>
        <input type="file" id="hidden-file-picker" accept=".pdf,.txt" />
      </div>

      <button class="btn-action" id="btn-process-doc" disabled>Process Document</button>
      <div class="feedback-text" id="process-feedback"></div>
      <div class="active-doc-indicator" id="current-doc-info"></div>
    </aside>

    <!-- Main Chat Interface -->
    <section class="conversation-area">
      <div class="chat-history" id="chat-thread">
        <div class="placeholder-view" id="empty-chat-view">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <p>Please upload a file to begin asking questions.</p>
        </div>
      </div>

      <div class="composer-area">
        <textarea id="prompt-input" rows="1" placeholder="Type your question here..." disabled></textarea>
        <button class="btn-submit" id="btn-submit-query" disabled>Ask</button>
      </div>
    </section>
  </main>

  <script>
    const AppState = {
      activeSessionId: null,
      chosenFile: null
    };

    // DOM Elements Reference
    const ui = {
      dropZone: document.getElementById("document-drop-area"),
      filePicker: document.getElementById("hidden-file-picker"),
      processBtn: document.getElementById("btn-process-doc"),
      feedbackBox: document.getElementById("process-feedback"),
      docDetails: document.getElementById("current-doc-info"),
      chatContainer: document.getElementById("chat-thread"),
      noContentView: document.getElementById("empty-chat-view"),
      inputBox: document.getElementById("prompt-input"),
      submitBtn: document.getElementById("btn-submit-query")
    };

    // Event Listeners for File Selection
    ui.dropZone.addEventListener("click", () => ui.filePicker.click());
    
    ui.filePicker.addEventListener("change", (event) => {
      handleFileChoice(event.target.files[0]);
    });

    ui.dropZone.addEventListener("dragover", (event) => { 
      event.preventDefault(); 
      ui.dropZone.classList.add("active-drag"); 
    });
    
    ui.dropZone.addEventListener("dragleave", () => {
      ui.dropZone.classList.remove("active-drag");
    });
    
    ui.dropZone.addEventListener("drop", (event) => {
      event.preventDefault();
      ui.dropZone.classList.remove("active-drag");
      handleFileChoice(event.dataTransfer.files[0]);
    });

    const handleFileChoice = (fileObject) => {
      if (!fileObject) return;
      
      const fileName = fileObject.name.toLowerCase();
      if (!fileName.endsWith(".pdf") && !fileName.endsWith(".txt")) {
        showFeedback("Error: Only .pdf and .txt formats are accepted.", "is-error");
        return;
      }
      
      AppState.chosenFile = fileObject;
      
      // Update UI for selected file
      ui.dropZone.innerHTML = `
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <span>${fileObject.name}</span>
      `;
      
      ui.processBtn.disabled = false;
      showFeedback("");
    };

    // Document Ingestion Process
    ui.processBtn.addEventListener("click", async () => {
      if (!AppState.chosenFile) return;
      
      ui.processBtn.disabled = true;
      showFeedback("Uploading and parsing document...", "is-loading");

      const payload = new FormData();
      payload.append("file", AppState.chosenFile);

      try {
        const response = await fetch("/upload", { 
          method: "POST", 
          body: payload 
        });
        
        const responseData = await response.json();
        
        if (!response.ok) {
          throw new Error(responseData.error || "Upload failed");
        }

        AppState.activeSessionId = responseData.sessionId;
        
        // Update interface on success
        showFeedback(`Success: Extracted ${responseData.chunks} segments.`, "is-success");
        ui.docDetails.textContent = `Attached: ${AppState.chosenFile.name}`;
        ui.docDetails.classList.add("visible");
        
        ui.inputBox.disabled = false;
        ui.submitBtn.disabled = false;
        ui.inputBox.focus();
        
      } catch (err) {
        showFeedback(`Operation failed: ${err.message}`, "is-error");
        ui.processBtn.disabled = false;
      }
    });

    // Chat Interaction Logic
    ui.submitBtn.addEventListener("click", executeQuery);
    
    ui.inputBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) { 
        event.preventDefault(); 
        executeQuery(); 
      }
    });

    async function executeQuery() {
      const userText = ui.inputBox.value.trim();
      
      if (!userText || !AppState.activeSessionId) return;

      ui.noContentView.style.display = "none";
      renderMessage("user", userText);
      
      // Reset input box
      ui.inputBox.value = "";
      ui.inputBox.style.height = "auto";
      ui.submitBtn.disabled = true;

      const loaderElement = renderMessage("ai", "Generating response...", true);

      try {
        const serverRes = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            question: userText, 
            sessionId: AppState.activeSessionId 
          }),
        });
        
        const data = await serverRes.json();
        
        if (!serverRes.ok) {
          throw new Error(data.error || "Failed to retrieve answer");
        }
        
        // Update UI with response
        loaderElement.querySelector(".bubble-content").textContent = data.answer;
        loaderElement.classList.remove("processing");
        
      } catch (err) {
        loaderElement.querySelector(".bubble-content").textContent = `Error: ${err.message}`;
        loaderElement.classList.remove("processing");
      } finally {
        ui.submitBtn.disabled = false;
        ui.inputBox.focus();
      }
    }

    const renderMessage = (senderRole, contentString, isProcessing = false) => {
      const wrapperDiv = document.createElement("div");
      
      const roleClass = senderRole === "user" ? "from-user" : "from-ai";
      const processClass = isProcessing ? " processing" : "";
      
      wrapperDiv.className = `chat-bubble-container ${roleClass}${processClass}`;
      
      const senderLabel = senderRole === "user" ? "You" : "Assistant";
      const safeContent = sanitizeHtml(contentString);
      
      wrapperDiv.innerHTML = `
        <div class="sender-name">${senderLabel}</div>
        <div class="bubble-content">${safeContent}</div>
      `;
      
      ui.chatContainer.appendChild(wrapperDiv);
      ui.chatContainer.scrollTop = ui.chatContainer.scrollHeight;
      
      return wrapperDiv;
    };

    const showFeedback = (messageText, statusClass = "") => {
      ui.feedbackBox.textContent = messageText;
      ui.feedbackBox.className = `feedback-text ${statusClass}`;
    };

    const sanitizeHtml = (rawText) => {
      return rawText
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    };

    // Dynamic textarea resize
    ui.inputBox.addEventListener("input", function() {
      this.style.height = "auto";
      this.style.height = Math.min(this.scrollHeight, 150) + "px";
    });
  </script>
</body>
</html>
